[package]
name = "mnemonic"
version = "0.1.0"
description = "Mnemonic desktop shell"
authors = ["Mnemonic"]
edition = "2021"

[lib]
name = "mnemonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mnemonic-core = { path = "../crates/mnemonic-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
log = "0.4"
env_logger = "0.11"
tauri-plugin-notification = "2.3.3"
