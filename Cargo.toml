[workspace]
members = [
    "crates/mnemonic-app",
    "crates/mnemonic-core",
]
exclude = ["src-tauri", "vendor/zed"]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
